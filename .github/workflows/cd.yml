name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync Netlify Production Environment
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ALLOW_DEMO_ADMIN: ${{ vars.ALLOW_DEMO_ADMIN }}
          NETLIFY_DB_PATH: ${{ vars.NETLIFY_DB_PATH }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            if [ -n "$AUTH_SECRET" ]; then
              bunx netlify-cli env:set AUTH_SECRET "$AUTH_SECRET" --site "$NETLIFY_SITE_ID" --context production --force --secret
            fi
            if [ -n "$ADMIN_PASSWORD" ]; then
              bunx netlify-cli env:set ADMIN_PASSWORD "$ADMIN_PASSWORD" --site "$NETLIFY_SITE_ID" --context production --force --secret
            fi
            if [ -n "$ALLOW_DEMO_ADMIN" ]; then
              bunx netlify-cli env:set ALLOW_DEMO_ADMIN "$ALLOW_DEMO_ADMIN" --site "$NETLIFY_SITE_ID" --context production --force
            fi
            DB_TARGET="${NETLIFY_DB_PATH:-/tmp/grovia.db}"
            bunx netlify-cli env:set DB_PATH "$DB_TARGET" --site "$NETLIFY_SITE_ID" --context production --force
          else
            echo "Netlify secrets not configured; skipping environment sync."
          fi

      - name: Deploy to Netlify Production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            bunx netlify-cli deploy --build --prod
          else
            echo "Netlify secrets not configured; skipping deploy."
          fi
